---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    fabric8.io/git-commit: 8a5458910e4236d5cf73a6d52da188289088881c
    fabric8.io/git-branch: main
    fabric8.io/git-url: https://github.com/Reynanwq/Gubee-training.git
    fabric8.io/scm-url: https://github.com/spring-projects/spring-boot/interview/interview-core
    fabric8.io/scm-tag: HEAD
  labels:
    app: interview-core
    provider: fabric8
    version: 1.0.0-SNAPSHOT
    group: gubee
  name: interview-core
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: interview-core
      provider: fabric8
      group: gubee
  template:
    metadata:
      annotations:
        fabric8.io/git-commit: 8a5458910e4236d5cf73a6d52da188289088881c
        fabric8.io/git-branch: main
        fabric8.io/scm-tag: HEAD
        fabric8.io/git-url: https://github.com/Reynanwq/Gubee-training.git
        fabric8.io/scm-url: https://github.com/spring-projects/spring-boot/interview/interview-core
      labels:
        app: interview-core
        provider: fabric8
        version: 1.0.0-SNAPSHOT
        group: gubee
    spec:
      containers:
      - env:
        - name: KUBERNETES_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: gubee/interview:latest
        imagePullPolicy: IfNotPresent
        name: interview-api
        securityContext:
          privileged: false
