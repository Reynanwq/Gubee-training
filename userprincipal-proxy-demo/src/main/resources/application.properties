server.port=8080
spring.application.name=UserPrincipal Proxy Demo

# Configurações do MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/userprincipal_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=mcpe1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Logging
logging.level.com.exemplo=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Configurações de Segurança Customizadas
app.security.jwt.secret=mySecretKeyForJWTTokenGenerationAndValidation123456789
app.security.jwt.expiration=86400000